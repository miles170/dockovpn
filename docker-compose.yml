# First run:
# echo HOST_ADDR=$(curl -s https://api.ipify.org) > .env && docker-compose up -d
# Find your client config under ./openvpn_conf/clients/<client-id>/client.ovpn

version: '3'
services:
  dockovpn:
    image: alekslitvinenk/openvpn
    cap_add:
        - NET_ADMIN
    ports:
        - 1194:1194/udp # Expose tcp if you defined HOST_TUN_PROTOCOL=tcp
    environment:
        HOST_ADDR: ${HOST_ADDR} 
    volumes:
        - ./openvpn_conf:/opt/Dockovpn_data
    restart: always
